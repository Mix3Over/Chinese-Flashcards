<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chinese Flashcards</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: one-column phone app, stacked screens (decks → deck → study), card set on a 田字格 practice grid */
:root{color-scheme:light;
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#E3E9E5; --ink:#17211D; --muted:#5E6B66; --line:#D2DBD6;
  --accent:#17715A; --accent-ink:#FFFFFF; --accent-soft:#D6EBE3; --seal:#B8322A; --grid:#E2B9B4;
  --t1:#C8332B; --t2:#C77A0A; --t3:#2E8B45; --t4:#2A5FB8; --t5:#7B8580;
  --shadow:0 1px 2px rgba(20,40,32,.06),0 8px 24px rgba(20,40,32,.08);
  --f-ui:system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-han:"Songti SC","Noto Serif SC","Noto Serif CJK SC","STSong","SimSun",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#18211E; --sunk:#111917; --ink:#E4ECE8; --muted:#95A39D; --line:#2A3632;
  --accent:#4FBF94; --accent-ink:#06150F; --accent-soft:#1D3A30; --seal:#E0645A; --grid:#5A3431;
  --t1:#F0675E; --t2:#EBA53C; --t3:#5CC67A; --t4:#6E9CF0; --t5:#8E9A95;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#18211E; --sunk:#111917; --ink:#E4ECE8; --muted:#95A39D; --line:#2A3632;
  --accent:#4FBF94; --accent-ink:#06150F; --accent-soft:#1D3A30; --seal:#E0645A; --grid:#5A3431;
  --t1:#F0675E; --t2:#EBA53C; --t3:#5CC67A; --t4:#6E9CF0; --t5:#8E9A95;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.han{font-family:var(--f-han);font-weight:500}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}

#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 10px;min-height:56px}
.bar h1{font-size:20px;font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.icon-btn:active{background:var(--sunk)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;display:flex;flex-direction:column;gap:16px;padding-bottom:24px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--sunk);min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--seal);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45}

/* Home */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:4px 2px}
.hero .big{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .lbl{color:var(--muted);font-size:14px}
.seal{font-family:var(--f-han);font-weight:700;color:var(--seal);border:2px solid var(--seal);border-radius:6px;width:52px;height:52px;display:grid;place-items:center;font-size:24px;line-height:1;transform:rotate(-4deg);flex:none}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;background:transparent;text-align:left;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{color:var(--muted);font-size:14px}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.zero{background:var(--sunk);color:var(--muted)}
.chev{color:var(--muted);flex:none}
.foot{color:var(--muted);font-size:13px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--accent)}
.empty{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{margin:0;font-size:20px;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:32ch}
.empty .han{font-size:56px;color:var(--seal);line-height:1.1}
.stack{display:flex;flex-direction:column;gap:10px;width:100%}

/* Deck */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 6px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.section-h h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px;font-size:16px}
.crow .h{font-size:24px;min-width:3.2em;line-height:1.2}
.crow .p{font-size:14px}
.crow .m{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.boxes{display:flex;gap:3px;flex:none}
.boxes i{width:5px;height:14px;border-radius:2px;background:var(--line)}
.boxes i.f{background:var(--accent)}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted);text-align:center;margin:0}

.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;background:transparent;width:100%;text-align:left;border-top:1px solid var(--line)}
.opt:first-child{border-top:0}
.opt .main{flex:1;min-width:0}
.opt .name{font-weight:600}
.opt .sub{color:var(--muted);font-size:13px}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .radio{border-color:var(--accent)}
.opt[aria-pressed="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.opt:disabled{opacity:.45}
.field select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
.stats.four{grid-template-columns:repeat(4,1fr);gap:8px}
.stats.four .stat{padding:10px 10px}
.stats.four .stat span{font-size:11px;letter-spacing:.03em}
.stat.warn b{color:var(--seal)}
/* Study */
.study{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:12px}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.card{flex:1;min-height:340px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 18px;position:relative;text-align:center}
.tzg{position:relative;width:min(62vw,220px);aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.tzg svg{position:absolute;inset:0;width:100%;height:100%}
.tzg svg *{stroke:var(--grid);fill:none}
.tzg .han{position:relative;font-size:clamp(56px,20vw,120px);line-height:1;white-space:nowrap}
.tzg.long .han{font-size:clamp(40px,12vw,76px)}
.tzg.xlong .han{font-size:clamp(28px,8vw,48px);white-space:normal}
.card .meaning{font-size:24px;font-weight:600;max-width:24ch;text-wrap:balance;overflow-wrap:anywhere}
.card .pinyin{font-size:26px;font-weight:500;letter-spacing:.01em}
.card .hint{position:absolute;bottom:14px;left:0;right:0;font-size:13px;color:var(--muted)}
.card .reveal{display:flex;flex-direction:column;gap:8px;align-items:center}
.card .divider{width:40px;height:2px;background:var(--line);border-radius:2px}
.speak{position:absolute;top:12px;right:12px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grades .btn{flex-direction:column;gap:0;padding:8px 6px;min-height:58px}
.grades small{font-weight:500;font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.g-again{background:var(--sunk);color:var(--seal)}
.g-good{background:var(--accent);color:var(--accent-ink)}
.g-easy{background:var(--accent-soft);color:var(--accent)}
.done{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-top:40px}
.done .han{font-size:72px;color:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.prog i{transition:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h2{margin:0;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:17px;width:100%;min-width:0}
.field textarea{min-height:170px;resize:vertical;font-size:16px}
.field input.han{font-size:26px}
.preview{font-size:14px;color:var(--muted);min-height:1.2em}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
</style>
</head>
<body>

<div id="app"></div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const KEY = 'chinese-flashcards-v1';
const PREF = 'chinese-flashcards-prefs';
const DAY = 86400000;
const INTERVALS = [0, 1, 3, 7, 14, 30, 60, 120]; // days per box
const NEW_PER_SESSION = 20;

const STARTER = [
 ['你好','ni3 hao3','hello'],['谢谢','xie4 xie5','thank you'],['再见','zai4 jian4','goodbye'],
 ['我','wo3','I, me'],['你','ni3','you'],['他','ta1','he, him'],['是','shi4','to be'],
 ['不','bu4','not, no'],['好','hao3','good'],['人','ren2','person'],['中国','Zhong1 guo2','China'],
 ['朋友','peng2 you5','friend'],['老师','lao3 shi1','teacher'],['学生','xue2 sheng5','student'],
 ['吃','chi1','to eat'],['喝','he1','to drink'],['水','shui3','water'],['茶','cha2','tea'],
 ['米饭','mi3 fan4','cooked rice'],['今天','jin1 tian1','today'],['明天','ming2 tian1','tomorrow'],
 ['昨天','zuo2 tian1','yesterday'],['一','yi1','one'],['二','er4','two'],['三','san1','three'],
 ['大','da4','big'],['小','xiao3','small'],['爱','ai4','to love'],['书','shu1','book'],
 ['家','jia1','home, family'],['猫','mao1','cat'],['狗','gou3','dog']
];

/* ---------- pinyin ---------- */
const MARKS = {a:'āáǎàa',e:'ēéěèe',i:'īíǐìi',o:'ōóǒòo',u:'ūúǔùu','ü':'ǖǘǚǜü'};
const TONE_OF = {};
for (const v in MARKS) [...MARKS[v]].slice(0,4).forEach((ch,i)=>{ TONE_OF[ch]=i+1; TONE_OF[ch.toUpperCase()]=i+1; });
function markSyl(syl, tone){
  syl = syl.replace(/u:|v/g,'ü').replace(/U:|V/g,'Ü');
  if (tone===5 || tone===0) return syl;
  const low = syl.toLowerCase();
  let idx = low.indexOf('a');
  if (idx<0) idx = low.indexOf('e');
  if (idx<0 && low.includes('ou')) idx = low.indexOf('o');
  if (idx<0) { for (let i=low.length-1;i>=0;i--) if ('aeiouü'.includes(low[i])) { idx=i; break; } }
  if (idx<0) return syl;
  const m = MARKS[low[idx]][tone-1];
  const out = syl[idx]===low[idx] ? m : m.toUpperCase();
  return syl.slice(0,idx)+out+syl.slice(idx+1);
}
function toMarks(s){
  return String(s||'').replace(/([a-zA-ZüÜ:]+?)([1-5])/g,(_,syl,t)=>markSyl(syl,+t)).replace(/\s+/g,' ').trim();
}
function toneOf(syl){ for (const ch of syl) if (TONE_OF[ch]) return TONE_OF[ch]; return 5; }
function pinyinHTML(p){
  return String(p||'').split(/(\s+)/).map(w=>/\s/.test(w)||!w ? w : `<span class="t${toneOf(w)}">${esc(w)}</span>`).join('');
}
function hanziHTML(h,p){
  const chars=[...String(h||'')].filter(c=>!/\s/.test(c));
  const syls=String(p||'').trim().split(/\s+/).filter(Boolean);
  if (!syls.length || chars.length!==syls.length || !chars.every(c=>/\p{Script=Han}/u.test(c))) return esc(h);
  return chars.map((c,i)=>`<span class="t${toneOf(syls[i])}">${esc(c)}</span>`).join('');
}

/* ---------- utils ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dayStart = t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};
const plural = (n,w)=>`${n} ${w}${n===1?'':'s'}`;
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
const ICON = {
  back:'<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
  close:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  speak:'<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
  chev:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>'
};
const GRID = '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="1" y="1" width="98" height="98" stroke-width="1.5"/><path d="M50 1V99M1 50H99" stroke-width=".8" stroke-dasharray="3 3"/><path d="M1 1L99 99M99 1L1 99" stroke-width=".6" stroke-dasharray="2 3"/></svg>';

/* ---------- prefs (per device) ---------- */
let prefs={dir:'h2m',mode:'due',order:'random',voice:'',rate:.8};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(PREF)||'{}'));}catch(e){}
const savePrefs=()=>{try{localStorage.setItem(PREF,JSON.stringify(prefs));}catch(e){}};

/* ---------- voice ---------- */
let voices=[];
function loadVoices(){ try{ voices=(window.speechSynthesis.getVoices()||[]).filter(v=>/^(zh|cmn)/i.test(v.lang)); }catch(e){ voices=[]; } }
function voiceScore(v){
  const l=v.lang.replace('_','-').toLowerCase(), n=(v.name+' '+v.voiceURI).toLowerCase();
  let s=0;
  if(l==='zh-cn'||l==='cmn-cn'||l.includes('hans')) s+=100; else if(l==='zh-tw'||l.includes('hant')) s+=40; else if(l==='zh-hk'||l.includes('yue')) s-=100;
  if(n.includes('premium')) s+=30; else if(n.includes('enhanced')) s+=20;
  if(/eloquence|compact|novelty/.test(n)) s-=15;
  return s;
}
function pickVoice(){
  if(prefs.voice){ const v=voices.find(v=>v.voiceURI===prefs.voice); if(v) return v; }
  return voices.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null;
}
function voiceLabel(v){
  const l=v.lang.replace('_','-');
  const region=/hk|yue/i.test(l)?'Cantonese':/tw|hant/i.test(l)?'Taiwan':'Mainland';
  return `${v.name} · ${region}`;
}
try{ loadVoices(); window.speechSynthesis&&window.speechSynthesis.addEventListener&&window.speechSynthesis.addEventListener('voiceschanged',loadVoices); }catch(e){}
function speak(text){
  try{
    const s=window.speechSynthesis; if(!s||!window.SpeechSynthesisUtterance){toast('Audio isn’t available on this device');return;}
    if(!voices.length) loadVoices();
    s.cancel(); const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang='zh-CN';
    u.rate=prefs.rate||.8; s.speak(u);
  }catch(e){toast('Audio isn’t available on this device');}
}

/* ---------- store (saved on this device) ---------- */
const store={decks:{}};
try{const j=JSON.parse(localStorage.getItem(KEY)||'null'); if(j&&j.decks) store.decks=j.decks;}catch(e){}
function saveCache(){try{localStorage.setItem(KEY,JSON.stringify({decks:store.decks,savedAt:Date.now()}));return true;}catch(e){toast('Could not save. Your phone may be out of storage.');return false;}}
function changed(){ saveCache(); }
function flush(){}

/* ---------- scheduling ---------- */
const now=()=>Date.now();
const isNew=c=>!c.seen;
const isDue=c=>c.seen&&(c.due||0)<=now();
function counts(deck){
  let n=0,d=0,l=0,w=0; for(const c of deck.cards){ if(isNew(c)) n++; else if(isDue(c)) d++; if((c.box||0)>=3) l++; if(c.wrong) w++; }
  return {newC:n,due:d,learned:l,wrong:w,total:deck.cards.length,todo:d+Math.min(n,NEW_PER_SESSION)};
}
function nextBox(c,g){ const b=c.box||0; return g==='again'?0:g==='good'?Math.min(b+1,7):Math.min(b+2,7); }
function fmtDays(n){ if(n===0) return 'now'; if(n<30) return n+'d'; if(n<365) return Math.round(n/30)+'mo'; return Math.round(n/365)+'y'; }
function gradeLabel(c,g){ return g==='again'?'again soon':fmtDays(INTERVALS[nextBox(c,g)]); }
function applyGrade(c,g){
  c.box=nextBox(c,g); c.seen=true;
  c.due = g==='again' ? now() : dayStart(now())+INTERVALS[c.box]*DAY;
}

/* ---------- routing ---------- */
let view={name:'home'};
const app=$('#app');
function go(v){ view=v; render(); window.scrollTo(0,0); }
function refresh(){
  if(view.name==='home') render();
  else if(view.name==='deck'){ if(!store.decks[view.id]) go({name:'home'}); else updateDeck(); }
}
function render(){
  if(view.name==='home') renderHome();
  else if(view.name==='deck') renderDeck();
  else if(view.name==='study') renderStudy();
}
const sortedDecks=()=>Object.values(store.decks).sort((a,b)=>(a.created||0)-(b.created||0));

/* ---------- study ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function gather(deckIds){
  const out=[]; for(const id of deckIds){ const d=store.decks[id]; if(d) d.cards.forEach(c=>out.push({d:id,c})); } return out;
}
function modePools(deckIds){
  const all=gather(deckIds);
  const due=all.filter(x=>isDue(x.c)), fresh=all.filter(x=>isNew(x.c)).slice(0,NEW_PER_SESSION);
  return {
    due: due.concat(fresh),
    all: all,
    mistakes: all.filter(x=>x.c.wrong).sort((a,b)=>(b.c.missAt||0)-(a.c.missAt||0))
  };
}
function studySheet(deckIds){
  const pools=modePools(deckIds);
  let mode=prefs.mode; if(!pools[mode]||!pools[mode].length) mode=['due','mistakes','all'].find(m=>pools[m].length)||'all';
  let order=prefs.order, dir=prefs.dir;
  const scope=deckIds.length>1?'all decks':'this deck';
  const MODES=[
    ['due','Due today',n=>n?`${plural(n,'card')} ready · new words and reviews`:'Nothing due. You’re caught up'],
    ['all','All cards',n=>`Every card in ${scope} · ${plural(n,'card')}`],
    ['mistakes','Mistakes',n=>n?`${plural(n,'card')} you got wrong · a card leaves once you get it right`:'No mistakes to practice']
  ];
  openSheet(`<h2>Study ${deckIds.length>1?'all decks':esc(store.decks[deckIds[0]].name)}</h2>
    <div class="list" role="radiogroup" aria-label="What to study">${MODES.map(([k,t,sub])=>`
      <button class="opt" data-mode="${k}" aria-pressed="${mode===k}" ${pools[k].length?'':'disabled'}>
        <span class="radio"></span><div class="main"><div class="name">${t}</div><div class="sub">${sub(pools[k].length)}</div></div></button>`).join('')}</div>
    <div class="field"><label>Order</label><div class="seg" role="group" aria-label="Order">
      <button data-order="random" aria-pressed="${order==='random'}">Random</button>
      <button data-order="list" aria-pressed="${order==='list'}">In order</button></div></div>
    <div class="field"><label>Card front</label><div class="seg" role="group" aria-label="Card front">
      <button data-dir="h2m" aria-pressed="${dir==='h2m'}">中文 → English</button>
      <button data-dir="m2h" aria-pressed="${dir==='m2h'}">English → 中文</button></div></div>
    <button class="btn primary block" id="start">Start</button>`);
  const root=$('#sheetRoot');
  const sync=()=>{
    root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
    root.querySelectorAll('[data-order]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.order===order));
    root.querySelectorAll('[data-dir]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dir===dir));
    const n=pools[mode].length; const st=$('#start'); st.disabled=!n; st.textContent=n?`Start · ${plural(n,'card')}`:'Nothing to study';
  };
  root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;sync();});
  root.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{order=b.dataset.order;sync();});
  root.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{dir=b.dataset.dir;sync();});
  sync();
  $('#start').onclick=()=>{
    Object.assign(prefs,{mode,order,dir}); savePrefs();
    let items=pools[mode].slice(); if(order==='random') shuffle(items);
    closeSheet();
    const title=deckIds.length>1?'All decks':store.decks[deckIds[0]].name;
    const modeName={due:'Due today',all:'All cards',mistakes:'Mistakes'}[mode];
    go({name:'study',decks:deckIds,title,modeName,mode,queue:items.map(x=>x.d+'|'+x.c.id),total:items.length,done:0,again:0,missed:new Set(),revealed:false,dir});
  };
}
function curItem(){
  while(view.queue.length){
    const [did,cid]=view.queue[0].split('|'); const d=store.decks[did]; const c=d&&d.cards.find(x=>x.id===cid);
    if(c) return {c,d}; view.queue.shift();
  }
  return null;
}
function leaveStudy(){ flush(); go(view.decks.length===1&&store.decks[view.decks[0]]?{name:'deck',id:view.decks[0]}:{name:'home'}); }
function renderStudy(){
  const it=curItem(), c=it&&it.c;
  const back=`<header class="bar"><button class="icon-btn" id="back" aria-label="Stop studying">${ICON.close}</button><h1>${esc(view.title)} <span class="muted" style="font-weight:500;font-size:15px">· ${esc(view.modeName)}</span></h1><span class="muted" style="font-variant-numeric:tabular-nums">${c?view.queue.length+' left':''}</span></header>`;
  if(!c){
    app.innerHTML=`${back}<main><div class="done"><div class="han" aria-hidden="true">好</div><h2 style="margin:0">Session complete</h2>
      <p class="muted" style="margin:0">You reviewed ${plural(view.done,'card')}${view.again?` and repeated ${view.again} you missed`:''}.</p>
      ${view.missed.size?`<p class="muted" style="margin:0">${plural(view.missed.size,'card')} added to Mistakes.</p>`:''}
      <button class="btn primary" id="fin">Done</button></div></main>`;
    $('#back').onclick=$('#fin').onclick=leaveStudy; return;
  }
  const h2m=view.dir==='h2m';
  const n=[...c.h].length, cls=n>6?'xlong':n>2?'long':'';
  const hanBlock=`<div class="tzg ${cls}">${n<=2?GRID:''}<span class="han">${view.revealed?hanziHTML(c.h,c.p):esc(c.h)}</span></div>`;
  const front = h2m ? hanBlock : `<div class="meaning">${esc(c.m)}</div>`;
  const reveal = view.revealed ? (h2m
      ? `<div class="reveal"><div class="divider"></div><div class="pinyin">${pinyinHTML(c.p)}</div><div class="meaning">${esc(c.m)}</div></div>`
      : `<div class="reveal"><div class="divider"></div>${hanBlock}<div class="pinyin">${pinyinHTML(c.p)}</div></div>`) : '';
  const pct = view.total ? Math.round(100*view.done/(view.done+view.queue.length)) : 0;
  app.innerHTML=`${back}<div class="study">
    <div class="prog"><i style="width:${pct}%"></i></div>
    <button class="card" id="card" aria-label="${view.revealed?'Card':'Show answer'}">
      ${front}${reveal}
      ${view.revealed?'':'<span class="hint">Tap to show answer</span>'}
    </button>
    ${view.revealed?`<div class="grades">
      <button class="btn g-again" data-g="again">Again<small>${gradeLabel(c,'again')}</small></button>
      <button class="btn g-good" data-g="good">Good<small>${gradeLabel(c,'good')}</small></button>
      <button class="btn g-easy" data-g="easy">Easy<small>${gradeLabel(c,'easy')}</small></button></div>`
      :`<button class="btn primary block" id="show" style="min-height:58px">Show answer</button>`}
  </div>`;
  if(h2m||view.revealed){
    const sp=document.createElement('button'); sp.className='icon-btn speak'; sp.setAttribute('aria-label','Play pronunciation'); sp.innerHTML=ICON.speak;
    sp.onclick=e=>{e.stopPropagation();speak(c.h);};
    $('#card').appendChild(sp);
  }
  $('#back').onclick=leaveStudy;
  const show=()=>{ if(!view.revealed){view.revealed=true;renderStudy();} };
  $('#card').onclick=show; const sb=$('#show'); if(sb) sb.onclick=show;
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>grade(b.dataset.g));
}
function grade(g){
  const it=curItem(); if(!it) return; const c=it.c, key=view.queue[0];
  applyGrade(c,g); view.queue.shift();
  if(g==='again'){ view.again++; view.missed.add(key); c.wrong=true; c.misses=(c.misses||0)+1; c.missAt=now(); view.queue.splice(Math.min(3,view.queue.length),0,key); }
  else { view.done++; if(!view.missed.has(key)) c.wrong=false; }
  view.revealed=false; changed(); renderStudy();
}
document.addEventListener('keydown',e=>{
  if(view.name!=='study'||$('#sheetRoot').firstChild||/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key===' '||e.key==='Enter'){ if(!view.revealed){e.preventDefault();view.revealed=true;renderStudy();} }
  else if(view.revealed&&['1','2','3'].includes(e.key)) grade(['again','good','easy'][+e.key-1]);
});

function openSheet(html){
  const root=$('#sheetRoot');
  root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  $('#scrim').onclick=e=>{if(e.target.id==='scrim') closeSheet();};
  return root;
}
function closeSheet(){ $('#sheetRoot').innerHTML=''; }
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheetRoot').firstChild) closeSheet();});
function armConfirm(btn,label,fn){
  let armed=false,t;
  btn.onclick=()=>{ if(armed){clearTimeout(t);fn();return;} armed=true; const old=btn.textContent; btn.textContent=label;
    t=setTimeout(()=>{armed=false;btn.textContent=old;},3000); };
}

function parseLines(text){
  const out=[];
  for(const raw of String(text).split(/\r?\n/)){
    const line=raw.trim(); if(!line) continue;
    let parts = line.includes('\t') ? line.split('\t') : line.split(/\s*[,，;；|]\s*|\s+[-–—]\s+/);
    parts=parts.map(s=>s.trim()).filter(Boolean);
    if(parts.length<2) continue;
    const h=parts[0];
    let p='',m;
    if(parts.length===2) m=parts[1]; else { p=parts[1]; m=parts.slice(2).join(', '); }
    out.push({h,p:toMarks(p),m});
  }
  return out;
}
function importSheet(deckId){
  const d=store.decks[deckId];
  openSheet(`<h2>Import words</h2>
    <p class="muted" style="margin:0;font-size:14px">One word per line: characters, pinyin, meaning. Commas, tabs or semicolons all work, so you can paste straight from a spreadsheet.</p>
    <form id="f" class="stack" style="gap:14px">
      <div class="field"><label for="ta">Word list</label><textarea id="ta" lang="zh-CN" placeholder="银行, yin2 hang2, bank&#10;医生, yi1 sheng1, doctor&#10;飞机, fei1 ji1, airplane"></textarea><div class="preview" id="pv">Nothing to import yet</div></div>
      <button class="btn primary block" type="submit" id="go" disabled>Import</button>
    </form>`);
  const ta=$('#ta'),pv=$('#pv'),go_=$('#go');
  ta.oninput=()=>{ const r=parseLines(ta.value); pv.textContent=r.length?`${plural(r.length,'card')} ready`:'Nothing to import yet'; go_.disabled=!r.length; go_.textContent=r.length?`Import ${plural(r.length,'card')}`:'Import'; };
  $('#f').onsubmit=e=>{ e.preventDefault(); const r=parseLines(ta.value); if(!r.length) return;
    const have=new Set(d.cards.map(x=>x.h)); let added=0;
    for(const x of r){ if(have.has(x.h)) continue; have.add(x.h); d.cards.push({id:uid('c'),...x,box:0,seen:false,due:0}); added++; }
    changed(d.id); closeSheet(); updateDeck();
    toast(added===r.length?`Imported ${plural(added,'card')}`:`Imported ${added}, skipped ${r.length-added} already in this deck`);
  };
}

    <div class="field"><label for="vsel">Chinese voice</label>
      ${sorted.length?`<select id="vsel"><option value="">Automatic · best installed voice${cur&&!prefs.voice?` (${esc(cur.name)})`:''}</option>
        ${sorted.map(v=>`<option value="${esc(v.voiceURI)}" ${prefs.voice===v.voiceURI?'selected':''}>${esc(voiceLabel(v))}</option>`).join('')}</select>`
      :`<p class="note" style="text-align:left">No Chinese voices found on this device yet.</p>`}</div>
    <div class="field"><label>Speaking speed</label><div class="seg" role="group" aria-label="Speaking speed">
      ${rates.map(([r,t])=>`<button data-rate="${r}" aria-pressed="${String(prefs.rate)===r||(+prefs.rate===+r)}">${t}</button>`).join('')}</div></div>
    <button class="btn ghost block" id="vtest">Play test: <span class="han" style="margin-left:4px">妈 麻 马 骂</span></button>
    <p class="muted" style="margin:0;font-size:14px">You should hear four different tones: mā, má, mǎ, mà. For clearer tones, download a better voice: iPhone <b>Settings → Accessibility → Spoken Content → Voices → Chinese (China mainland)</b>, pick a voice marked <b>Premium</b> or <b>Enhanced</b>, and tap download. Then close and reopen this app and choose it above.</p>
    <button class="btn ghost block" id="backup2">Back up or restore cards</button>`);
  const root=$('#sheetRoot');
  const vs=$('#vsel'); if(vs) vs.onchange=()=>{prefs.voice=vs.value;savePrefs();speak('你好');};
  root.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{prefs.rate=+b.dataset.rate;savePrefs();
    root.querySelectorAll('[data-rate]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  $('#vtest').onclick=()=>speak('妈，麻，马，骂。');
  $('#backup2').onclick=backupSheet;
}

/* ---------- backup ---------- */
function backupSheet(){
  const n=Object.values(store.decks).reduce((s,d)=>s+d.cards.length,0);
  openSheet(`<h2>Backup</h2>
    <p class="muted" style="margin:0;font-size:14px">Your cards live only on this phone. Save a backup file now and then, for example to iCloud Drive in the Files app, so you can restore them on a new phone.</p>
    <button class="btn primary block" id="exp">Save backup file (${plural(n,'card')})</button>
    <div class="field"><label for="imp">Restore from a backup file</label><input id="imp" type="file" accept=".json,application/json"></div>
    <p class="note" id="impMsg"></p>`);
  $('#exp').onclick=async()=>{
    const d=new Date(), stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const name=`flashcards-backup-${stamp}.json`;
    const json=JSON.stringify({app:'chinese-flashcards',version:1,exported:d.toISOString(),decks:store.decks});
    const file=new File([json],name,{type:'application/json'});
    try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; } }
    catch(e){ if(e&&e.name==='AbortError') return; }
    const url=URL.createObjectURL(file); const a=document.createElement('a'); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  };
  $('#imp').onchange=async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{
      const j=JSON.parse(await f.text());
      if(!j||typeof j.decks!=='object') throw 0;
      let decks=0,cards=0;
      for(const id in j.decks){ const d=j.decks[id]; if(!d||!Array.isArray(d.cards)) continue;
        const cur=store.decks[id];
        if(cur){ const have=new Set(cur.cards.map(c=>c.id)); for(const c of d.cards) if(!have.has(c.id)){cur.cards.push(c);cards++;} }
        else { store.decks[id]={id,name:d.name||'Restored deck',created:d.created||Date.now(),cards:d.cards}; decks++; cards+=d.cards.length; }
      }
      saveCache(); closeSheet(); render(); toast(`Restored ${plural(decks,'deck')}, ${plural(cards,'card')}`);
    }catch(err){ $('#impMsg').textContent='That file isn’t a flashcards backup. Choose a file named flashcards-backup-….json.'; }
  };
}

render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
